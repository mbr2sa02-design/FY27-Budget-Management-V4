y level.","ind":"L1- Proportion of households using basic drinking water services","defn":"Proportion of the households using an improved drinking water source within 30 minutes round trip of their household, including queuing time. \nAn improved drinking water source:, by nature of its construction or through active intervention, is likely to be protected from outside contamination, in particular from contamination with faecal matter and more likely to provide \"safe\" water, such as a household connection, a borehole, etc.\nThis indicator measures the proportion of households with access to a basic drinking water supply. A basic drinking water facility is defined as an improved water source within 30 minute round trip of household, including queuing time, including water sources on plot.\nAn improved drinking water facility is defined as a source or delivery point that by nature of its construction, or through active intervention, is protected from outside contamination, in particular from contamination with fecal matter. The following are considered to be improved drinking water facilities: piped drinking water supply on premises; public taps/stand posts; tube well/ borehole; protected dug well; protected spring; rainwater. Packaged water is considered improved if households use an improved water facility for other domestic purposes.\nWhen measuring this indicator over time, ensure that it is measured in the same seasons to account for fluctuations in seasonality. If not possible, ask questions for wet and dry season availability to better understand seasonal changes.\n\n**This indicator is measured under Annual Impact Measurement (AIM)**","typ":"Long-Term Outcome Indicator","uom":"UOM-00007 - Household","tool":"TC3 - Caregiver Survey","freq":"","mov":"CV003 - Baseline and end project evaluation report","pop":"","dis":"","dir":"Increase","src":"","base":{"date":"30-Jun-2023","res":"49.42","n":"212","d":"429"},"yrs":{"2023":{"t":"","a":"","v":"","x":""},"2024":{"t dition, SAG and WMC conducted awareness raising on benefits of latrines and safe water in community. With actively participated of local authority and PDRD in awareness raising in community, the community people have improved their knowledge and changed their behavior from no latrine turn to latrine usage. However, project will maintain good progress and keep working with relevant stakeholders to mobilize local resources to establish latrine for MVFs."},"2026":{"t":"125","a":"223","v":"79","x":"C3B.027587: This indicator exceeded its target due to strong collaboration with the Sanitation Action Group (SAG), which raised community awareness on the health risks of poor sanitation, including diarrhea and skin diseases. As a result, 55 household latrines (33 in the first semester and 22 in the second semester) were newly constructed by community members during FY26, benefiting households that previously lacked access to their own sanitation facilities. In FY27, the project will continue working with SAGs to provide awareness raising, training, and support to households without latrines to improve sanitation and hygiene practices."},"2027":{"t":"70","a":"","v":"","x":""}},"h1":{"t":"35","a":"","v":""},"h2":{"t":"35","a":"","v":""},"lop":{"t":"296","a":"1,163","v":"292.91","p":"392.91"},"mod":"Dinna Di 14-Apr-2026 04:57","plan":{"badges":["Count","Accumulation: FY = H1 + H2","LOP: sum of years"],"fy":"70","fyn":"People","tl":[["Oct–Mar (first 6 months)","35"],["Apr–Sep (last 6 months)","35"],["FY27 total","70 = H1 + H2"]],"last":"Target 125 · achieved 223 (as recorded in the ITT file)","lopl":"Target 296 · achieved to date 1,163","how":"Accumulation: count only new people in each 6-month period and add them (FY27 = Oct–Mar + Apr–Sep). LOP is the sum of all years.","flags":[],"h":"Oct–Mar 35 · Apr–Sep 35"}},"bcode":"55.02"},{"code":"55.04","sector":"Nutrition - Output","ind":"L2- Number of boreholes fitted with hand pumps completed in communities","fy27":"1","lop":"5","too ceived intervention from parent, HC staff and project staff. However, the project will continue to work with HC and CHW to conduct MUAC at all target villages to ensure all children will be protected and cared for in the next year."},"2025":{"t":"13","a":"28","v":"115.38","x":"This indicator is over-achieved due to the project has worked with Village Health Support Group (VHSG) by village to conduct Mid Upper Arm Circumference (MUAC) Identification as whole of 36 villages with children age 6-59 months. As the result, the project found 18 more children with unhealthy in this FY. This achievement is over for Annual (target set 13 children for annual). However, the project will continue to work with HC and VHSG to conduct MUAC at all target villages to ensure all children will be found and refer to treat at hospital on time."},"2026":{"t":"16","a":"12","v":"25","x":"This indicator was under-achieved because the programme targeted only children aged 6-59 months for MUAC screening activities to identify stunting, wasting, and other forms of malnutrition. As a result of the screenings conducted, no children were found to be malnourished based on MUAC measurements. Furthermore, since the beginning of the AP, the programme has closely coordinated with existing CHWs, VHSGs, and Health Centre staff to implement health and nutrition interventions across the target communities. This sustained effort has improved caregivers' knowledge and practices on appropriate child feeding, contributing to the positive nutritional status of children in the project area. During FY27, 7 children were reached in the 1st semester and 9 children in the 2nd semester, for a total of 16 children."},"2027":{"t":"16","a":"","v":"","x":""}},"h1":{"t":"7","a":"","v":""},"h2":{"t":"9","a":"","v":""},"lop":{"t":"67","a":"55","v":"-17.91","p":"82.09"},"mod":"Dinna Di 08-Apr-2026 12:37","plan":{"badges":["Count","Accumulation: FY = H1 + H2","LOP: sum of years"],"fy":"16","fyn":"People","tl":[["Oct–Mar (firs lder engagement, the project promoted policy reforms that enhance access to quality health and nutrition services, particularly for vulnerable women and children. Capacity-building activities enabled local authorities and community leaders to actively participate in planning, implementation, and monitoring processes. This collaborative approach increased accountability, strengthened health systems, and encouraged communities to take responsibility for their own health and nutrition outcomes. As a result, National guidelines on Minimum Package of Activities, Nutrition Action Plan Management to contribute to improving children nutrition policy implementation became more effective, inclusive, and responsive to local needs and priorities. For next year, the program will coordinate with related key partners to monitor this policy improvement."},"2027":{"t":"2","a":"","v":"","x":""}},"h1":{"t":"0","a":"","v":""},"h2":{"t":"2","a":"","v":""},"lop":{"t":"3","a":"1","v":"-66.67","p":"33.33"},"mod":"Piphup Hien 06-Apr-2026 08:58","plan":{"badges":["Count","Accumulation: FY = H1 + H2","LOP: sum of years"],"fy":"2","fyn":"Events/Activities","tl":[["Oct–Mar (first 6 months)","no separate target"],["Apr–Sep (last 6 months)","2"],["FY27 total","2"]],"last":"Target 1 · achieved 4 (as recorded in the ITT file)","lopl":"Target 3 · achieved to date 1 · remaining 2","how":"Accumulation: count only new events/activities in each 6-month period and add them (FY27 = Oct–Mar + Apr–Sep). LOP is the sum of all years.","flags":[],"h":""}},"bcode":"54.01"},{"code":"54.01","sector":"Nutrition - Output","ind":"L1- Number of policy changes which were advocated for by a coalition/platform in which World Vision played a significant role","fy27":"1","lop":"2","tool":"OT - Other","mov":"CV136 - Advocacy Strategic Measurments (ASMs)","freq":"Every Six Months","itt":{"sec":"Nutrition","ic":"C5G.027610","lvl":"Output","stmt":"Increased the availability of quality Early Childhood Care and Development (ECC of vulnerable children reached through policy change related to the global campaign (either ENOUGH or It Takes a World), to which World Vision made a signficant contribution, and where there is evidence that the policy is being implemented, in order to ensure it is having impacts on children.  \n\nA policy includes government or humanitarian policies, as well as plans (i.e. UN Response Plans), budgets, and/or strategies (i.e. Government or Cluster strategy). Policy changes can be newly developed policies, significant changes/amendments to existing policies, or improved implementation of an existing policy. They must have been passed into law, and not still in draft form. Policy implementation means that the government is currently undertaking activities to achieve the policy goals. The focus of the policy should be aligned to at least one of the global campaign objectives","typ":"Annual Outcome Indicator","uom":"UOM-00001 - People","tool":"OT - Other","freq":"","mov":"CV040 - Policy briefs","pop":"TP3 - Child 0-18 years","dis":"","dir":"Increase","src":"","base":{"date":"29-May-2025","res":"","n":"0","d":""},"yrs":{"2023":{"t":"","a":"","v":"","x":""},"2024":{"t":"","a":"","v":"","x":""},"2025":{"t":"0","a":"0","v":"0","x":""},"2026":{"t":"2,500","a":"7,380","v":"195.20","x":"This indicator is overachieved due to World Vision Cambodia collaborated with district government and local authorities to establish a district nutrition management committee to finding the challenges, root cause, developed seven action plans of safety food and nutrition food to address child malnutrition. The initiative to reduce stunting, wasting, weakened immunity, and vulnerability to infectious diseases such as pneumonia and diarrhea in all 19 primary schools and 36 villages. Committee members provided nutrition education, counseling, and support to affected families, while distributing vegetable seeds, animal breeds, and technical training on crop cultivation and livestock raising. Through effective coordination and monitoring, all seven action plans were successfully implemented across 36 villages to improve nutrition and child well-being. For next year, the program will coordinate with related this committee to monitor this action plans."},"2027":{"t":"3,000","a":"0","v":"-100","x":""}},"h1":{"t":"","a":"","v":""},"h2":{"t":"3,000","a":"","v":""},"lop":{"t":"5,500","a":"0","v":"-100","p":"0"},"mod":"Dinna Di 18-Oct-2025 03:20","plan":{"badges":["Count","Accumulation: FY = H1 + H2","LOP: sum of years"],"fy":"3,000","fyn":"People","tl":[["Oct–Mar (first 6 months)","no separate target"],["Apr–Sep (last 6 months)","3,000"],["FY27 total","3,000"]],"last":"Target 2,500 · achieved 7,380 (as recorded in the ITT file)","lopl":"Target 5,500 · achieved to date 0 · remaining 5,500","how":"Accumulation: count only new people in each 6-month period and add them (FY27 = Oct–Mar + Apr–Sep). LOP is the sum of all years.","flags":[],"h":""}},"bcode":"54"},{"code":"54","sector":"Nutrition - Outcome","ind":"L1- Proportion of children exclusively breastfed until 6 months of age","fy27":"69.47% (≈ 66 of 95 (last recorded denominator))","lop":"69.47%","tool":"TC3 - Caregiver Survey","mov":"CV004 - Caregiver Survey report,CV028 - LQAS record","freq":"","itt":{"sec":"Nutrition","ic":"C3A.027633","lvl":"Outcome","stmt":"Improved access to health and nutrition services and positive behaviour change among pregnant women and caregivers of children under five years.","ind":"L1- Proportion of children exclusively breastfed until 6 months of age","defn":"This indicator measures EBF in the previous 24 hours for infants 0-5 months of age who are currently living. This indicator is based upon \"completed months\". For example, the current international standard for exclusive breastfeeding is the provision of breast milk only until 6 months of age. The exclusive breastfeeding indicator therefore includes children aged 0, 1, 2, 3, 4, and 5 completed months. This is a proxy indicator because we assume that behaviour during the day prior to interview is representative of a general pattern. This temporal restriction helps minimise problems with recall.To assess EBF, we use a series of questions to accurately obtain information on supplemental foods provided to infants (from DHS). Please note that breast milk includes breast milk that the mother has expressed or breast milk from a wet nurse. Report of giving the child any other liquid or food besides breast milk means EBF does not exist. The only exceptions are when the infant is given ORS, drops, syrups (vitamins, minerals, medicines). \n\n\n**This indicator is measured under Annual Impact Measurement (AIM)**","typ":"Annual Outcome Indicator","uom":"UOM-00001 - People","tool":"TC3 - Caregiver Survey","freq":"","mov":"CV004 - Caregiver Survey report,CV028 - LQAS record","pop":"TP5 - Child 0-5 months","dis":"D0016 - Sex/Age Children","dir":"Increase","src":"","base":{"date":"30-Jun-2023","res":"63.08","n":"41","d":"65"},"yrs":{"2023":{"t":"65.26%","a":"0%","v":"-100","x":"This year, the project does not apply LQAS tool for this indicator."},"2024":{"t":"66.32%","a":"74.74% (71/95)","v":"12.70","x":"This indicator is over-achieved due to the project has worked with Community Health Worker (CHW) and Health Center Staff (HC) to provide the knowledge on important of exclusive breastfeeding aligned with Ministry of Health (MoH) guideline to grandmothers who stayed permanently in the community. They understand well and continue to share this knowledge to their daughters who are mothers have youngest children age 0-6 months at home to feed their children. Furthermore, the project coordinated with CWH and HC to provide the important of exclusive breastfeeding to mothers of children who are outside of GMIA group to attend in Intergeneration session by village. So, majority of mothers of youngest children are 0-6 months always permanent stay at home to provide the exclusively breastfed to their children. The r measures the prevalence of appropriate management with ORT (oral rehydration therapy) of children age 0-59 months with diarrhoea in the past two weeks. The indicator will be used to measure effectiveness of WV 7-11 health programming. Diarrhoea is defined as more than three loose stools passed during a 24-hour period. ORT prevents and/or corrects the dehydration that is a result of diarrhoea. ORT is a general term that includes: age appropriate continued feeding and increased liquids, plus ORS and zinc supplement. Highly effective treatment defines ORT as increased liquid and continued food plus low osmolarity ORS and zinc. Treatment using low osmolarity ORS and zinc is recommended by the WHO. Only fluid made from an ORS packet solution, a sachet or packet mixed with clean water in the home, and pre-packaged ORS fluid are counted as ORS for this indicator. Please note that home preparations, even if government recommended, are not considered ORS.Continued feeding and increased fluids or breastfeeding during illnesses is necessary to compensate for nutritional losses associated with the illness. For this indicator, infants less than 6 months of age who were given fluids, other than ORS or breast milk, or who were given foods during the illness would be categorised as NOT receiving appropriate treatment.\n\n**This indicator is measured under Annual Impact Measurement (AIM)**","typ":"Annual Outcome Indicator","uom":"UOM-00001 - People","tool":"TC3 - Caregiver Survey","freq":"","mov":"CV004 - Caregiver Survey report,CV028 - LQAS record","pop":"TP6 - Child 0-59 months","dis":"D0016 - Sex/Age Children","dir":"Increase","src":"","base":{"date":"30-Jun-2023","res":"23.29","n":"17","d":"73"},"yrs":{"2023":{"t":"25.26%","a":"0%","v":"-100","x":"This year, the project does not apply LQAS tool for this indicator."},"2024":{"t":"27.37%","a":"23.08% (3/13)","v":"-15.67","x":"This indicator is under-achieved due to there was less applying of grandmother on diarrhea treatment for the children when they were busied outside home and having many children under their support. Project worked with CHW and HC to provide the diarrhea knowledge to grandmother to treat their children get diarrhea but some of grandmothers have a lot of children in feeding at home so they are not so good applying this knowledge to align recommendation of HC like using Oral rehydration solutions (ORS) or access to health center. Furthermore, now at Health Center have not enough ORS to provide the community people who access to diarrhea treatment for their children, so of grandmothers didn’t know this ORS. For next period, the project work close with HC to increase ORS in stock and continue provide the knowledge related diarrhea management to grandmothers. We do hope this indicator will reach the target in FY25."},"2025":{"t":"29.47%","a":"0%","v":"-100","x":"AIM indicators need data disaggregation for reporting such as gender, age group, while AIM dashboard do not have those available data"},"2026":{"t":"30.53%","a":"0%","v":"-100","x":"This indicator is under-achieved due to there was less applying of grandmother on diarrhea treatment for the children when they were busied outside home and having many children under their support. Project worked with CHW and HC to provide the diarrhea knowledge to grandmother to treat their children get diarrhea but some of grandmothers have a lot of children in feeding at home so they are not so good applying this knowledge to align recommendation of HC like using Oral rehydration solutions (ORS) or access to health center. Furthermore, now at Health Center have not enough ORS to provide the community people who access to diarrhea treatment for their children, so of grandmothers didn’t know this ORS. For next period, the project work close with HC to increase ORS in stock and continue provide the knowledge related diarrhea management to grandmothers. We do hope this indicator will reach the target in FY27."},"2027":{"t":"32.63%","a":" ategy Scorecard.","typ":"Annual Outcome Indicator","uom":"UOM-00001 - People","tool":"OT - Other","freq":"","mov":"CV041 - Policy piece (information/data/analysis) or press release record,CV046 - Public announcement by MoH or similarly charged institution,CV047 - Public mentions via media, gov't website and other publications","pop":"TP3 - Child 0-18 years","dis":"","dir":"Increase","src":"","base":{"date":"29-May-2025","res":"","n":"0","d":""},"yrs":{"2023":{"t":"","a":"","v":"","x":""},"2024":{"t":"","a":"","v":"","x":""},"2025":{"t":"0","a":"20,966","v":"0","x":""},"2026":{"t":"3,684","a":"7,380","v":"100.33","x":"This indicator is overachieved due to World Vision Cambodia collaborated with district government and local authorities to establish a district nutrition management committee to finding the challenges, root cause, developed seven action plans of safety food and nutrition food to address child malnutrition. The initiative to reduce stunting, wasting, weakened immunity, and vulnerability to infectious diseases such as pneumonia and diarrhea in all 19 primary schools and 36 villages. Committee members provided nutrition education, counseling, and support to affected families, while distributing vegetable seeds, animal breeds, and technical training on crop cultivation and livestock raising. Through effective coordination and monitoring, all seven action plans were successfully implemented across 36 villages to improve nutrition and child well-being. For next year, the program will coordinate with related this committee to monitor this action plans."},"2027":{"t":"3,684","a":"0","v":"-100","x":""}},"h1":{"t":"","a":"","v":""},"h2":{"t":"3,684","a":"","v":""},"lop":{"t":"7,368","a":"20,966","v":"184.55","p":"284.55"},"mod":"Dinna Di 18-Oct-2025 03:18","plan":{"badges":["Count","Accumulation: FY = H1 + H2","LOP: sum of years"],"fy":"3,684","fyn":"People","tl":[["Oct–Mar (first 6 months)","no separate target"],["Apr–Sep (last 6 months)","3,684"],["FY27 total", ) to be considered a modern method, 3 conditions must be met: 1. Baby is under 6 months 2. Mother is still breastfeeding 3. Menses have not returned.\n\n**This indicator is measured under Annual Impact Measurement (AIM)**","typ":"Annual Outcome Indicator","uom":"UOM-00001 - People","tool":"OT - Other","freq":"","mov":"CV004 - Caregiver Survey report","pop":"TP44 - Women 15-49 years","dis":"D0033 - Girls/Women Age Group,D0051 - Disabled Community Members","dir":"Increase","src":"","base":{"date":"","res":"","n":"","d":""},"yrs":{"2023":{"t":"","a":"","v":"","x":""},"2024":{"t":"0%","a":"0%","v":"0","x":""},"2025":{"t":"0%","a":"0%","v":"0","x":""},"2026":{"t":"0%","a":"0%","v":"0","x":""},"2027":{"t":"0%","a":"0%","v":"0","x":""}},"h1":{"t":"","a":"","v":""},"h2":{"t":"0%","a":"","v":""},"lop":{"t":"0%","a":"0%","v":"0","p":"0"},"mod":"Bonthoeurt Soy 23-Oct-2025 10:00","plan":{"badges":["Numerator ÷ Denominator","LOP: latest result (maintain)"],"fy":"0%","fyn":"","tl":[["Oct–Mar (first 6 months)","no separate target"],["Apr–Sep (last 6 months)","no separate target"],["FY27 total","0%"]],"last":"Target 0% · achieved 0% (as recorded in the ITT file)","lopl":"Target 0% · achieved to date 0%","how":"Numerator ÷ Denominator × 100. Numerator = people meeting the standard; denominator = all people assessed. Record both numbers, not only the %. LOP is the latest result: reach the target level and maintain it.","flags":[],"h":""}},"bcode":"54"},{"code":"68","sector":"Education - Outcome","ind":"Proportion of schools with improved learning environment.","fy27":"95% (≈ 19 of 19 (last recorded denominator))","lop":"95%","tool":"TC3 - Caregiver Survey","mov":"CamMoV058 - Observation report/record","freq":"","itt":{"sec":"Education","ic":"C2D.13536","lvl":"Outcome","stmt":"Increased proportion of schools achieve \"Quality Learning Environment\"","ind":"Proportion of schools with improved learning environment.","defn":"* Improved Learning environment refer to a Quality standard of ct staff collaborated with school directors and librarians to improve library standard by school by motivating them to apply their knowledge of library management after the training. AP regular reflection and field visit all target school with supervision team to help school directors/teachers to fill in the gaps was found through coaching and feedback. Furthermore, In the next year, AP ensures to maintain and improve the standards of school libraries to give greater impact to child learning outcome."},"2025":{"t":"17","a":"17","v":"0","x":""},"2026":{"t":"19","a":"19","v":"0","x":"This indicator was over-achieved because schools and librarians received continuous project support throughout the year. The project provided learning materials, conducted library management reflection, and organized regular coaching and reflection sessions with school directors and librarians. These efforts improved librarians’ skills, strengthened library management practices, enhanced the quality of library activities, and encouraged more effective use of library resources. As a result, 19 libraries met the required standards, exceeding the annual target of 17 libraries. The project will continue to strengthen all standard of all libraries in the next year."},"2027":{"t":"17","a":"19","v":"89.47","x":""}},"h1":{"t":"17","a":"","v":""},"h2":{"t":"17","a":"","v":""},"lop":{"t":"83","a":"67","v":"-19.28","p":"80.72"},"mod":"Sophy Leap 08-Apr-2026 07:26","plan":{"badges":["Count","Maintain: FY = latest running total","LOP: sum of years"],"fy":"17","fyn":"Institution","tl":[["By 31 Mar 2027 (6 months)","17"],["By 30 Sep 2027 (12 months)","17"],["FY27 total","17 = latest value"]],"last":"Target 19 · achieved 19 (as recorded in the ITT file)","lopl":"Target 83 · achieved to date 67 · remaining 16","how":"Maintain: report the running total of institution each period. The 12-month figure already includes the first 6 months, so FY27 = latest value, not H1 + H2. LOP is the sum of the yearly results.","flags":[],"h":"Oct–Mar 17 · Apr–Sep 17"}},"bcode":"68.01"},{"code":"68.02","sector":"Education - Output","ind":"# of teachers trained in non-pedagogical skills or approaches, dissagregated by sex.","fy27":"5","lop":"160","tool":"TC19 - Project Documentation","mov":"CamMoV001 - Activity tracker (MEQA)","freq":"Every Six Months","itt":{"sec":"Education","ic":"C2A.22933","lvl":"Output","stmt":"Key stakeholders equipped with knowledge of positive discipline","ind":"# of teachers trained in non-pedagogical skills or approaches, dissagregated by sex.","defn":"\"Non-Pedagogical Training\"- Any teacher training that is not related to supporting teachers to teach better.  Topics might include child protection, gender, positive discipline/classroom management techniques etc; \"Attending\":  Teachers must attend at least 75% of the training in order to be counted as attending;  NOs can specify the specific training in bracket and disaggregate by level, sex and other factors; note that there is a separate indicator for training teachers on teaching or pedagogical techniques\n\nNon-pedagogical training refers to positive discipline curriculum for teachers, SD and teachers grade from gr.1 -6.","typ":"","uom":"UOM-00001 - People","tool":"TC19 - Project Documentation","freq":"Every Six Months","mov":"CamMoV001 - Activity tracker (MEQA)","pop":"TP-00052 - Adult Men,TP-00053 - Adult Women,TP42 - Teachers","dis":"","dir":"Increase","src":"","base":{"date":"31-Mar-2022","res":"","n":"46","d":""},"yrs":{"2023":{"t":"105","a":"112","v":"6.67","x":""},"2024":{"t":"20","a":"20","v":"0","x":""},"2025":{"t":"20","a":"20","v":"0","x":""},"2026":{"t":"10","a":"31","v":"210","x":"This indicator was over-achieved because the project the implementation of Positive Discipline reflection sessions and Child Protection training, which strengthened the capacity of education stakeholders to promote safe and protective learning environments and improved the application of child protection practices in schools. The education stakeholders also closely engaged child's parents and caregivers to promote positive parenting and monitor child's education regularly. The project will continue to collaborate with SD and relevant stockholders to promote child protection in school in the next year."},"2027":{"t":"5","a":"","v":"","x":""}},"h1":{"t":"0","a":"","v":""},"h2":{"t":"5","a":"","v":""},"lop":{"t":"160","a":"152","v":"-5","p":"95"},"mod":"Lida Leak 06-Apr-2026 07:33","plan":{"badges":["Count","Accumulation: FY = H1 + H2","LOP: sum of years"],"fy":"5","fyn":"People","tl":[["Oct–Mar (first 6 months)","no separate target"],["Apr–Sep (last 6 months)","5"],["FY27 total","5"]],"last":"Target 10 · achieved 31 (as recorded in the ITT file)","lopl":"Target 160 · achieved to date 152 · remaining 8","how":"Accumulation: count only new people in each 6-month period and add them (FY27 = Oct–Mar + Apr–Sep). LOP is the sum of all years.","flags":[],"h":""}},"bcode":"68.02"},{"code":"75","sector":"CP&P - Outcome","ind":"L1- Proportion of boys and girls (12-18 years) with positive and peaceful relations with their Parent(s)/Caregiver(s)","fy27":"53% (at evaluation)","lop":"53%","tool":"TC18 - Youth Healthy Behaviour Survey","mov":"CamMoV003 - Adolescent Survey Result","freq":"","itt":{"sec":"CP&P","ic":"C1B.027656","lvl":"Outcome","stmt":"Parents, caregivers, and community members provided positive caring and protective relationships to children and adolescents","ind":"L1- Proportion of boys and girls (12-18 years) with positive and peaceful relations with their Parent(s)/Caregiver(s)","defn":"This indicator assesses the proportion of boys and girls (aged 12-18) who report having positive and peaceful relationships with their parent(s) or caregiver(s). It focuses on key aspects such as the respect for feelings, understanding, and trust within the family context. It aims to capture the quality of the emotional connection, understanding, trust, and communication within the family unit.\n\nPositive and Peaceful Relationships in Families: Refers to the overall emotional well-being and harmonious interactions between adolescents and their Parent(s)/Caregiver(s), encompassing respect, understanding, trust, shared perspectives, and open communication.\n\nUnderstanding: Emphasize that this term involves the Parent(s)/Caregiver(s) comprehending the adolescent's feelings and perspectives.\n\nThe unit of measurement is the proportion of boys and girls aged 12-18 with positive and peaceful relationships with their parent(s) or caregiver(s). Responses to individual questions (FD13 to FD18) are coded on a scale from 0 to 4, with 0 indicating \"Almost Never True\" and 4 indicating \"Almost Always True.\"\n\nThe indicator relies on self-reported perceptions, which may be influenced by the individual's interpretation and subjectivity.\nCultural norms and expectations may influence the interpretation of positive and peaceful relationships, impacting cross-cultural comparisons.\n\n**This indicator is measured under Annual Impact Measurement (AIM)**","typ":"Long-Term Outcome Indicator","uom":"UOM-00001 - People","tool":"TC18 - Youth Healthy Behaviour Survey","freq":"","mov":"CamMoV003 - Adolescent Survey Result","pop":"TP8 - Child 12-18 years","dis":"D0042 - Sex/12-18 and 18+","dir":"Increase","src":"","base":{"date":"30-Jun-2023","res":"45.43","n":"194","d":"427"},"yrs":{"2023":{"t":"","a":"","v":"","x":""},"2024":{"t":"","a":"","v":"","x":""},"2025":{"t":"","a":"","v":"","x":""},"2026":{"t":"","a":"","v":"","x":""},"2027":{"t":"","a":"","v":"","x":""}},"h1":{"t":"","a":"","v":""},"h2":{"t":"","a":"","v":""},"lop":{"t":"","a":"","v":"","p":""},"mod":"Sam Ang Sou 09-Jul-2023 07:33","plan":{"badges":["Numerator ÷ Denominator","Set at evaluation"],"fy":"","fyn":"Baseline 45.43% → evaluation target 53%","tl":[["FY27 total","—"]],"last":"Target — · achieved — (as recorded in the ITT file)","lopl":"Evaluation target 53% · latest result is what counts","how":"Numerator ÷ Denominator × 100. Numerator = people meeting the standard; denominator = all people assessed. Record both numbers, not only the %. LOP is the latest result: reach the target level and maintain it.","flags":["No half-year target: this is measured at evaluation. Record the latest survey result and compare with the target."],"h":"","ev":{"t":53.0,"u":"%","b":45.43}}},"bcode":"75"},{"code":"75","sector":"CP&P - Outcome","ind":"L1- Proportion of adolescents who report having experienced any physical violence and/or psychological aggression by parent/caregivers in the past 12 months","fy27":"30% (at evaluation)","lop":"30%","tool":"TC18 - Youth Healthy Behaviour Survey","mov":"CamMoV003 - Adolescent Survey Result","freq":"","itt":{"sec":"CP&P","ic":"C2A.027626","lvl":"Outcome","stmt":"Parents, caregivers, and community members provided positive caring and protective relationships to children and adolescents","ind":"L1- Proportion of adolescents who report having experienced any physical violence and/or psychological aggression by parent/caregivers in the past 12 months","defn":"This is a Child Protection prevalence indicator that measures percent of adolescents aged 12–18 years who report having experienced any physical violence and/or psychological aggression by caregivers in the past 12 months disaggregated by sex. This indicator is aligned with INSPIRE indicator 1.1 and contributes to SDG 16.2.1. It is adapted from VACS physical and emotional violence questions.\nPhysical violence is defined as the intentional use of physical force with the potential to cause death, disability, injury or harm. Physical violence refers to any of the following actions: slapping, pushing, shoving, shaking, or intentionally throwing something at the participant to cause harm; punching, kicking, whipping, or beating the participant with an object; strangling, smothering, attempting to drown, or intentionally burning the participant; using or threatening the participant with a knife, gun, or any other weapon.\nPsychological aggression/emotional violence is defined as a pattern of verbal behaviour over time or an isolated incident that is not developmentally appropriate or supportive and that has a high probability of damaging an adolescent’s mental health or his/her physical, mental, spiritual, moral, or social development. Psychological aggression includes the following behaviors: informing the participant that they were unloved or undeserving of love; telling the participant that someone wished they had never been born or was dead; and subjecting the participant to ridicule or derogatory remarks, such as being called stupid, useless, good for nothing, or big-headed\nCaregiver refers to father, mother, step father, step mother, brother, sister or another caregiver.  \nSelf-administration is highly recommended, please refer to the Ethics Reference Guide to ensure your FO is adhering to Safeguarding policy and ethical protocols\n\n**This indicator is measured under Annual Impact Measurement (AIM)**","typ":"Long-Term Outcome Indicator","uom":"UOM-00001 - People","tool":"TC18 - Youth Healthy Behaviour Survey","freq":"","mov":"CamMoV003 - Adolescent Survey Result","pop":"TP8 - Child 12-18 years","dis":"","dir":"Decrease","src":"","base":{"date":"2023-09-29 00:00:00","res":"0.35","n":"149","d":"426"},"yrs":{"2023":{"t":"","a":"","v":"","x":""},"2024":{"t":"","a":"","v":"","x":""},"2025":{"t":"","a":"","v":"","x":""},"2026":{"t":"","a":"","v":"","x":""},"2027":{"t":"","a":"","v":"","x":""}},"h1":{"t":"","a":"","v":""},"h2":{"t":"","a":"","v":""},"lop":{"t":"","a":"","v":"","p":""},"mod":"Chanveasna Heng 10-Feb-2025 07:06","plan":{"badges":["Numerator ÷ Denominator","Set at evaluation","Lower is better"],"fy":"","fyn":"Baseline 35% → evaluation target 30%","tl":[["FY27 total","—"]],"last":"Target — · achieved — (as recorded in the ITT file)","lopl":"Evaluation target 30% · latest result is what counts","how":"Numerator ÷ Denominator × 100. Numerator = people meeting the standard; denominator = all people assessed. Record both numbers, not only the %. LOP is the latest result: reach the target level and maintain it.","flags":["No half-year target: this is measured at evaluation. Record the latest survey result and compare with the target."],"h":"","ev":{"t":30.0,"u":"%","b":35.0}}},"bcode":"75"},{"code":"75","sector":"CP&P - Outcome","ind":"L1- Proportion of adolescents who have a strong connection with their parent or caregiver","fy27":"70% (at evaluation)","lop":"70%","tool":"OT - Other","mov":"CamMoV003 - Adolescent Survey Result","freq":"","itt":{"sec":"CP&P","ic":"C2A.027674","lvl":"Outcome","stmt":"Parents, caregivers, and community members provided positive caring and protective relationships to children and adolescents","ind":"L1- Proportion of adolescents who have a strong connection with their parent or caregiver","defn":"This indicator measures the percentage of adolescents aged 12-18 years who feel strongly connected with their parents and/or primary caregivers. This is one of the key aspects of the environment in which adolescents live. Strong connection is measured in terms of the closeness of relationships between adolescents and parents or primary caregivers. Relationship with their primary caregivers is a major influencing factor on children’s well-being and their ability to develop and thrive. The items for measuring connection have been tested and validated in 12 different cultural settings. The 15 statements that comprise the connection indicator are about the young person’s relationship with parents or primary caregivers. The respondents are asked to choose from a list of adults, for example, mother, father, grandparent, aunt/uncle and guardian, the one with whom they spend most time. Adolescents who perceive that their caregivers support them in the ways measured in this indicator have statistically higher levels of well-being and lower levels of risk behaviours.\n\n**This indicator is measu ders who are engaging in programming focused on improving child well-being (CWB) across any sector or CWB focus area. Number of faith leaders who are engaging with World Vision in programming that contributes to improving child well-being across any sector or child well-being focus area. The faith leader may be doing any of a diverse range of  activities to support child well-being, such as working on a water project, promoting maternal health, promoting access to school, engaging in project model, doing Spiritual Nurture of Children with World Vision, conducting home visits, promoting positive parenting, transforming norms to promote child well-being, implementing kids clubs, etc. and much more.\n\"Faith Leader\" can have a range of different definitions across religions and contexts: it can be a clergy member, Pastor, Priest, Elder, Bishop, Rabbi, Monk, Nun, Imam, Sheikh, Children Minister, Youth Minister, Women's Leader, etc. Contexts should use the definition of 'faith leader' that best suits the corresponding context.","typ":"","uom":"UOM-00001 - People","tool":"TC19 - Project Documentation","freq":"Every Six Months","mov":"CV103 - Attenance list ( meeting and training)","pop":"OT - Other","dis":"D0020 - Faith,D0042 - Sex/12-18 and 18+","dir":"Increase","src":"","base":{"date":"31-Mar-2022","res":"","n":"0","d":""},"yrs":{"2023":{"t":"11","a":"11","v":"0","x":""},"2024":{"t":"13","a":"24","v":"84.62","x":"It is over-achieved due to the project strongly promoted faith leader engagement within project implementation in this year and the project also collaborated with faith leader from church in 3 communes to facilitate CF session in the community. However, the project still continues to engage with other faith leaders to join our project implementation especially build capacity them to enable to facilitate CF session the next year."},"2025":{"t":"49","a":"84","v":"71.43","x":"This indicator was overachieved due to the project thrived to expand the target benefici function saveProg(d){const[i,j]=d.split('.'),s=D.staff[i],x=s.indicators[j],p={};document.querySelectorAll('.fm [data-pg]').forEach(e=>{if(e.value!=='')p[e.dataset.pg]=e.value});x.prog={...p,ach:calc(x,p).s,st:$('#pg-s').value,note:$('#pg-n').value.trim(),by:USER?USER.name:'This device',at:new Date().toISOString()};save();push(['i',s.name,x.code,x.ind.slice(0,50)],x.prog);openD('i.'+i+'.'+j);render()}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.pg;if(!k)return;const p={};e.target.closest('.fm').querySelectorAll('[data-pg]').forEach(n=>p[n.dataset.pg]=n.value);const b=$('[data-a="saveprog"]'),[i,j]=b.dataset.d.split('.'),x=D.staff[i].indicators[j];$('#pg-c').innerHTML=calcH(x,p);const s=$('#pg-s');if(!s.dataset.m)s.value=sug(calc(x,p))});
document.addEventListener('change',e=>{if(e.target.id==='pg-s')e.target.dataset.m='1'});
const lastU=s=>{const m=META.last[s.name];return `<div class="leg">Indicators reported: ${s.indicators.filter(x=>x.prog).length}/${s.indicators.length}${m?` · last update ${esc(m.u)}, ${fmtT(m.t)}`:''}</div>`};
const desc=o=>{try{const k=JSON.parse(o.k);return k[0]==='a'?`${o.u} entered ${k[4]} spending for ${k[2]||k[3]} (${k[1]})`:k[0]==='i'?`${o.u} updated progress on ${k[2]} (${k[1]})`:`${o.u} set the planned month for ${k[2]||k[3]} (${k[1]})`}catch(e){return''}};
const feed=()=>!API?'<p class="note">Local mode: data stays on this device. Connect the shared system to see everyone’s updates here.</p>':`<h3>Recent updates by the team</h3>${META.recent.slice(0,12).map(o=>`<div class="ln"><b>${esc(desc(o))}</b><div class="lbl">${fmtT(o.t)}</div></div>`).join('')||'<p class="note">No updates yet.</p>'}`;
const CM={'80':['40','S02'],'81':['81','S18'],'82':['42','S01A'],'83':['43','S01A'],'84':['44','S15']};
const acode=(b,l)=>{const m=/^(8[0-4])\.(\d+)$/.exec(b.bcode||''),c=m&&CM[m[1]];return c?c[0]+'.'+m[2]+'.'+l+'-'+c[1]:(b.bcode||'')+'.'+l};
const secB=(s,b)=>{const x=s.indicators.find(x=>x.bcode===b.bcode&&x.itt);return x?x.itt.sec:''};
function explore(){const q=F.q.toLowerCase(),n=mi(),bl=[],il=[],L=60,opt=(a,v)=>a.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');
D.staff.forEach((s,i)=>{if(F.s!=='All'&&s.name!==F.s)return;
s.budget.forEach((b,j)=>{if(!+b.amount||b.type==='Less'||(F.bt!=='All'&&b.type!==F.bt)||(F.sec!=='All'&&secB(s,b)!==F.sec)||(q&&!(s.name+b.code+b.desc+b.type).toLowerCase().includes(q)))return;bl.push([s,i,b,j])});
s.indicators.forEach((x,j)=>{if(!x.itt||(F.sec!=='All'&&x.itt.sec!==F.sec)||(F.bt!=='All'&&F.bt!=='ITT output')||(q&&!(s.name+x.code+x.ind+x.itt.ic+x.tool+x.sector).toLowerCase().includes(q)))return;il.push([s,i,x,j])})});
const types=[...new Set(D.staff.flatMap(s=>s.budget.filter(b=>+b.amount&&b.type!=='Less').map(b=>b.type)))];
return `<div class="hero" style="--c:#2D9CDB"><h2>Explore</h2><p>Search and filter budget lines and ITT indicators across the whole team.</p></div><div class="fb"><input id="fq" data-f="q" type="search" placeholder="Search code, activity, indicator, tool, staff…" value="${esc(F.q)}"><select data-f="s" aria-label="Staff">${opt(['All',...D.staff.map(s=>s.name)],F.s)}</select><select data-f="sec" aria-label="ITT sector">${opt(['All','Education','Nutrition','CESP','CP&P'],F.sec)}</select><select data-f="bt" aria-label="Budget type">${opt(['All',...types],F.bt)}</select></div>
<h3>Budget lines (${bl.length})</h3><div class="grid">${bl.slice(0,L).map(([s,i,b,j])=>{const t=T([b],n),has=b.lines&&b.lines.length;return `<div class="card" style="--c:${COL[i]};cursor:pointer" data-d="${has?'b':'t'}.${i}.${has?j:0}"><div class="row"><div><span class="chip">${esc(b.code||'—')}</span><span class="lbl">${esc(s.name)}</span></div><span class="amt">${money(b.amount)}</span></div><div style="margin:6px 0">${esc(b.desc)}</div><div class="leg">${pill(t)} Spent ${money(t.act)} of ${money(t.bud)} · ${esc(b.type)}</div></div>`}).join('')||'<div class="empty">No budget lines match.</div>'}</div>
<h3>ITT indicators (${il.length})</h3><div class="grid">${il.slice(0,L).map(([s,i,x,j])=>`<div class="card" style="--c:${SEC[x.itt.sec]||COL[i]};cursor:pointer" data-d="i.${i}.${j}"><span class="chip">${esc(x.code)}</span><span class="lbl">${esc(s.name)} · ${esc(x.itt.sec)}</span><div style="margin:6px 0;font-weight:600">${esc(x.ind)}</div><div class="leg">FY27 target ${esc(x.fy27||'—')} · LOP ${esc(x.lop||'—')}</div>${progChip(x)}</div>`).join('')||'<div class="empty">No indicators match.</div>'}</div>${bl.length>L||il.length>L?`<p class="note">Showing the first ${L} of each. Narrow the search to see more.</p>`:''}`}
function overview(){let mx=Math.max(...D.staff.map(s=>tot(s).all)),T=D.staff.reduce((a,s)=>{const t=tot(s);a.all+=t.all;a.itt+=t.itt;a.gn+=t.gn;a.gift+=t.gift;a.i+=s.indicators.length;return a},{all:0,itt:0,gn:0,gift:0,i:0});
return `<div class="hero" style="--c:#7C5CFC"><h2>FY27 at a glance</h2><p>${esc(D.sub)}</p><div class="kpis"><div class="kpi"><b>${money(T.all)}</b><span>Total budget</span></div><div class="kpi"><b>${D.staff.length}</b><span>Staff</span></div><div class="kpi"><b>${T.i}</b><span>Indicators</span></div><div class="kpi"><b>${money(T.gn+T.gift)}</b><span>Community GN + Gift</span></div></div></div>
<h3>Team scope and budget</h3><div class="grid">${D.staff.map((s,i)=>{const t=tot(s),w=v=>(v/mx*100).toFixed(1)+'%';return `<a class="card" style="--c:${COL[i]}" href="#s${i}"><div class="row"><b>${esc(s.name)}</b><span class="amt">${money(t.all)}</span></div><div class="seg"><i style="width:${w(t.itt)};background:${COL[i]}"></i><i style="width:${w(t.gn)};background:#FFC93C"></i><i style="width:${w(t.gift)};background:#F25C54"></i></div><div class="leg"><span class="dot" style="background:${COL[i]}"></span>ITT ${money(t.itt)} <span class="dot" style="background:#FFC93C"></span>GN ${money(t.gn)} <span class="dot" style="background:#F25C54"></span>Gift ${money(t.gift)}</div><div class="leg" style="margin-top:6px">${s.indicators.length} indicators · ${s.scope.length} scope items</div></a>`}).join('')}</div>
<h3>Budget reconciliation</h3><div class="sw"><table><thead><tr>${D.recon[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${D.recon.slice(1).map(r=>`<tr>${r.map((c,j)=>`<td>${j&&!isNaN(c)&&c!==''?money(c):esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
<details><summary>Notes on the budget</summary>${D.notes.map((n,i)=>`<p class="note">${E('notes.'+i,n)}</p>`).join('')}</details>`}
function staffView(i){const s=D.staff[i],t=tot(s),p='staff.'+i,secs=['All',...new Set(s.indicators.map(x=>x.sector.split(' - ')[0]).filter(Boolean))];
const ind=s.indicators.map((x,j)=>[x,j]).filter(([x])=>(sec==='All'||x.sector.startsWith(sec))&&(!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase())));
const LM=edit?1e9:lim,shown=ind.slice(0,LM),tb=[['sc','Scope',s.scope.length],['bu','Budget',s.budget.length],['in','Indicators',s.indicators.length]];
const hero=`<div class="hero" style="--c:${COL[i]}"><h2>${esc(s.name)}</h2><p>FY27 scope of works</p><div class="kpis"><div class="kpi"><b>${money(t.all)}</b><span>Total budget</span></div><div class="kpi"><b>${money(t.itt)}</b><span>ITT activity</span></div><div class="kpi"><b>${money(t.gn+t.gift)}</b><span>GN + Gift</span></div><div class="kpi"><b>${s.indicators.length}</b><span>Indicators</span></div></div></div>`;
const tabs=`<div class="tabs" style="--c:${COL[i]}">${tb.map(([k,l,n])=>`<button data-a="tab" data-v="${k}" class="${k===stab?'on':''}">${l} <span style="opacity:.75">${n}</span></button>`).join('')}</div>`;
let body='';
if(stab==='sc')body=`<div class="sc" style="--c:${COL[i]}">${s.scope.map((x,j)=>`<div class="card">${X(`${p}.scope.${j}`)}<div class="lbl">${E(`${p}.scope.${j}.item`,x.item)}</div><div class="val">${E(`${p}.scope.${j}.value`,x.value)||'—'}</div></div>`).join('')}</div>${A(p+'.scope','Add scope item')}`;
else if(stab==='bu')body=`<div class="tot" style="margin:0 0 12px"><div>ITT activity (net)<b>${money(t.itt)}</b></div><div>Community GN<b>${money(t.gn)}</b></div><div>Community Gift<b>${money(t.gift)}</b></div><div>Total<b>${money(t.all)}</b></div></div>
<div class="grid" style="--c:${COL[i]}">${s.budget.map((b,j)=>`<div class="card" ${b.lines&&b.lines.length&&!edit?`data-d="b.${i}.${j}" style="cursor:pointer"`:''}>${X(`${p}.budget.${j}`)}<div class="row"><div><span class="chip">${E(`${p}.budget.${j}.code`,b.code||'—')}</span><span class="lbl">${E(`${p}.budget.${j}.type`,b.type)}</span></div><span class="amt">${edit?E(`${p}.budget.${j}.amount`,b.amount):money(b.amount)}</span></div><div class="${edit?'':'c3'}" style="margin-top:6px">${E(`${p}.budget.${j}.desc`,b.desc)}</div>${edit?more(b.lines&&b.lines.length,'b',i,j,'Activities and cost lines'):(b.lines&&b.lines.length?'<div class="lbl" style="margin-top:6px">Tap for cost lines ›</div>':'')}</div>`).join('')}</div>${A(p+'.budget','Add budget line')}`;
else body=`<div class="f" style="--c:${COL[i]}"><input id="q" type="search" placeholder="Search code, indicator, tool…" value="${esc(q)}">${secs.map(c=>`<button data-a="sec" data-v="${esc(c)}" class="${c===sec?'on':''}">${esc(c)}</button>`).join('')}</div>
<p class="note" style="margin:0 0 10px">Showing ${shown.length} of ${ind.length}. Tap a card for full details.</p>
<div class="grid">${shown.map(([x,j])=>{const c=SEC[x.sector.split(' - ')[0]]||COL[i],k=`${p}.indicators.${j}`;return `<div class="card" style="--c:${c};${x.itt&&!edit?'cursor:pointer':''}" ${x.itt&&!edit?`data-d="i.${i}.${j}"`:''}>${X(k)}<div><span class="chip">${E(k+'.code',x.code||'—')}</span><span class="lbl">${E(k+'.sector',x.sector)}</span></div><div class="${edit?'':'c3'}" style="margin:8px 0;font-weight:600">${E(k+'.ind',x.ind)}</div><div class="tg"><div><span class="lbl">FY27 target</span><b>${E(k+'.fy27',x.fy27||'—')}</b></div><div><span class="lbl">LOP target</span><b>${E(k+'.lop',x.lop||'—')}</b></div></div>${x.itt&&x.itt.plan&&x.itt.plan.flags.length?'<div class="fl" style="margin-top:6px">⚠ Check target</div>':''}${edit?`<div class="lbl" style="margin-top:8px">Tool: ${E(k+'.tool',x.tool||'—')}</div><div class="lbl">Verification: ${E(k+'.mov',x.mov||'—')}</div><div class="lbl">Frequency: ${E(k+'.freq',x.freq||'—')}</div>`:''}${progChip(x)}</div>`}).join('')||'<div class="empty">No indicators match.</div>'}</div>${!edit&&ind.length>shown.length?`<button class="more" data-a="lim" style="--c:${COL[i]}">Show ${Math.min(12,ind.length-shown.length)} more (${ind.length-shown.length} left) ›</button>`:''}${A(p+'.indicators','Add indicator')}
${s.notes.length?`<h3>Notes</h3>${s.notes.map((n,j)=>`<p class="note">${E(`${p}.notes.${j}`,n)}</p>`).join('')}`:''}`;
return hero+tabs+body}
function roadmap(){return `<div class="hero" style="--c:#2D9CDB"><h2>AP Road Map</h2><p>FY27 to FY29 priorities</p></div><div class="grid">${D.roadmap.map((r,j)=>`<div class="card" style="--c:${COL[j%6]}">${X('roadmap.'+j)}<span class="chip">${E(`roadmap.${j}.n`,r.n)}</span><div style="margin:8px 0;font-weight:700">${E(`roadmap.${j}.fy27`,r.fy27||'—')}</div>${['fy28','fy29','plan'].map(k=>r[k]||edit?`<div class="lbl">${k.toUpperCase()}: ${E(`roadmap.${j}.${k}`,r[k])}</div>`:'').join('')}</div>`).join('')}</div>${A('roadmap','Add road map item')}`}
function render(){const y=scrollY;hdrU();$('#t').textContent=D.title;$('#st').textContent=D.sub;
$('#nav').innerHTML=[['ov','Overview'],['ex','Explore'],['tr','Tracking'],...D.staff.map((s,i)=>['s'+i,s.name]),['rm','Road Map']].map(([id,l])=>`<a href="#${id}" class="${id===cur?'cur':''}">${esc(l)}</a>`).join('');
$('#m').innerHTML=cur==='ov'?overview():cur==='ex'?explore():cur==='tr'?tracking():cur==='rm'?roadmap():staffView(+cur.slice(1));
const qi=$('#q');if(qi)qi.oninput=e=>{q=e.target.value;lim=12;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};scrollTo(0,y)}
addEventListener('hashchange',()=>{cur=location.hash.slice(1)||'ov';q='';sec='All';stab='sc';lim=12;render();scrollTo(0,0)});
document.addEventListener('focusout',e=>{const el=e.target.closest&&e.target.closest('[data-p]');if(!el||!edit)return;const p=el.dataset.p;let v=el.innerText.trim();if(/\.amount$/.test(p))v=parseFloat(v.replace(/[$,]/g,''))||0;if(get(p.split('.').slice(0,-1).join('.'))!==undefined&&String(get(p))!==String(v)){setp(p,v);save();render()}});
document.addEventListener('click',e=>{if(e.target.id==='sh'){closeD();return}const o=e.target.closest('[data-a="open"]')||(!edit&&!e.target.closest('input,button,a')&&e.target.closest('[data-d]'));if(o){openD(o.dataset.d);return}const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,p=b.dataset.p;
if(a==='close'){closeD();return}if(a==='saveprog'){saveProg(b.dataset.d);return}if(a==='login'){doLogin();return}if(a==='logout'){USER=null;try{localStorage.removeItem('mbr2-user')}catch(e){}META.s='Not signed in';closeD();render();return}if(a==='csv'){csv();return}if(a==='sec'){sec=b.dataset.v;lim=12;render()}if(a==='tab'){stab=b.dataset.v;lim=12;render()}if(a==='lim'){lim+=12;render()}
if(a==='add'){const k=p.split('.').pop();get(p).push(JSON.parse(JSON.stringify(NEW[k])));save();render()}
if(a==='del'&&confirm('Delete this row?')){const k=p.split('.'),i=+k.pop();get(k.join('.')).splice(i,1);save();render()}
if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));l.download='data.json';l.click()}
if(a==='imp')$('#fi').click();
if(a==='rst'&&confirm('Remove your changes on this device and show the published version?')){try{localStorage.removeItem(KEY)}catch(e){}start()}});
$('#fi').onchange=async e=>{try{D=JSON.parse(await e.target.files[0].text());save();render()}catch(x){alert('That file is not a valid data.json.')}};
$('#eb').onclick=()=>{edit=!edit;$('#eb').textContent=edit?'Done':'Edit';$('#eb').classList.toggle('on',edit);$('#eb').setAttribute('aria-pressed',edit);$('#bar').classList.toggle('show',edit);render()};
async function start(){let l=null;try{l=localStorage.getItem(KEY)}catch(e){}
if(l){try{D=JSON.parse(l)}catch(e){}if(D&&D.v!==DEFAULT.v)D=null}
if(!D){try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)D=await r.json()}catch(e){}}
if(!D)D=JSON.parse(JSON.stringify(DEFAULT));render();pull();flush()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
$('#ub').onclick=openLogin;
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;F[f]=e.target.value;const p=e.target.selectionStart;render();if(f==='q'){const n=$('#fq');n.focus();n.setSelectionRange(p,p)}});
setInterval(pull,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
start();
</script></body></html>
